# ---------------------------------------------------------------------------
# SEIKM Daily Papers — topic taxonomy
#
# This file is the whole brain of the digest. Editing it changes what shows up.
# No Python required: add a phrase to a tier list and the next run picks it up.
#
# Tiers (weights set in config/settings.yaml):
#   strong  — phrase is near-decisive for the topic
#   medium  — phrase is supporting evidence
#   weak    — phrase nudges, never decides on its own
#
# Matching is case-insensitive, on whole words, over title + abstract.
# A hit in the TITLE counts extra (see scoring.title_boost in settings.yaml).
# Use hyphens/spaces as they normally appear; "physics-informed" also matches
# "physics informed" automatically.
# ---------------------------------------------------------------------------
